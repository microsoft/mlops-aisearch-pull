---
name: Build Validation Workflow

on:
  workflow_call:

env:
  PYTHON_VERSION: "3.11"

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    container:
        image: aipullacr.azurecr.io/devops_container_image:latest
        options: --user root
        credentials:
            username: ${{ env.ACR_USERNAME }}
            password: ${{ env.ACR_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Check Azure CLI Availability
        run: |
          echo "Current PATH: $PATH"
          which az
          ls -l $(which az) || echo "az not found in the expected directory"
          az --version

      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Load Python Dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install --upgrade -r requirements.txt

      - name: Lint Code
        run: flake8

      - name: Run Unit Tests
        shell: bash
        run: |
          pytest --junitxml=junit/test-results.xml --cov=. --cov-report=xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-*.xml"
