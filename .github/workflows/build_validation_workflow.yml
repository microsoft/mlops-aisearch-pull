---
name: Build Validation Workflow

on:
  workflow_call:
    secrets:
      ACR_TOKEN:
        required: true

jobs:
  run-unit-tests:
    runs-on: ubuntu-latest
    container:
        image:  ${{ vars.ACR_CONTAINER_REGISTRY }}.azurecr.io/${{ vars.IMAGE_NAME }}:latest
        options: --user root
        credentials:
            username: 00000000-0000-0000-0000-000000000000
            password: ${{ secrets.ACR_TOKEN }}
    steps:
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Lint Code
        run: flake8

      - name: Run Unit Tests
        shell: bash
        run: |
          pytest --junitxml=junit/test-results.xml --cov=. --cov-report=xml

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/test-*.xml"
