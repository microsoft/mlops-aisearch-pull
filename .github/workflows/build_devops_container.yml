name: Pre-build Dev Container Image and Push to Azure Container Registry

on:
  pull_request:
    branches:
      - 'development'
    paths:
      - '.github/workflows/build_devops_container.yml' 
      - 'requirements.txt'
      - '.buildcontainer/Dockerfile'

env:
    IMAGE_NAME: ${{ vars.IMAGE_NAME }}
    SUBSCRIPTION_ID: ${{ vars.SUBSCRIPTION_ID }}
    RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
    FEDERATED_CLIENT_ID: ${{ vars.FEDERATED_CLIENT_ID }}
    MANAGED_IDENTITY_TENANT_ID: ${{ vars.MANAGED_IDENTITY_TENANT_ID }}
    ACR_CONTAINER_REGISTRY: ${{ vars.ACR_CONTAINER_REGISTRY }}

permissions:
    id-token: write
    contents: read

jobs:
  build-and-push-build-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
            client-id: ${{ env.FEDERATED_CLIENT_ID }}
            tenant-id: ${{ env.MANAGED_IDENTITY_TENANT_ID}}
            subscription-id: ${{ env.SUBSCRIPTION_ID }}

      - name: Login to ACR with Azure CLI
        run: |
          az acr login --name ${{ env.ACR_CONTAINER_REGISTRY }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./.buildcontainer/Dockerfile 
          push: true
          no-cache: true
          tags: ${{ env.ACR_CONTAINER_REGISTRY }}.azurecr.io/${{ env.IMAGE_NAME }}:latest
